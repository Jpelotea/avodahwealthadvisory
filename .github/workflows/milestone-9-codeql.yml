name: Milestone 9 CodeQL

on:
  push:
    branches: [agent/blueprint-foundation]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

concurrency:
  group: milestone-9-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  javascript-security:
    name: CodeQL JavaScript security and quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify build and unit security gates
        env:
          CONTEXT: deploy-preview
          COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOY_ID: codeql-${{ github.run_id }}
          BUILD_ID: codeql-${{ github.run_id }}
          DEPLOY_URL: https://codeql-${{ github.run_id }}--avodahwealthadvisory.netlify.app
          DEPLOY_PRIME_URL: https://deploy-preview-8--avodahwealthadvisory.netlify.app
          BRANCH: agent/blueprint-foundation
          REVIEW_ID: 8
        run: |
          npm run build
          npm run test:unit
      - name: Analyze current branch head
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
