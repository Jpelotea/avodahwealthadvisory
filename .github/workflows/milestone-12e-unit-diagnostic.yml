name: Milestone 12E Unit Diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/milestone-12e-unit-debug-request

permissions:
  contents: read

jobs:
  unit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture complete build and unit output
        shell: bash
        run: |
          set +e
          {
            echo '=== BUILD ==='
            CONTEXT=deploy-preview COMMIT_REF=${{ github.event.pull_request.head.sha }} DEPLOY_ID=m12e-unit BUILD_ID=m12e-unit DEPLOY_URL=https://example.invalid DEPLOY_PRIME_URL=https://deploy-preview-8--avodahwealthadvisory.netlify.app BRANCH=agent/blueprint-foundation REVIEW_ID=8 npm run build
            build_exit=$?
            echo "BUILD_EXIT=$build_exit"
            echo '=== UNIT ==='
            npm run test:unit
            unit_exit=$?
            echo "UNIT_EXIT=$unit_exit"
          } 2>&1 | tee milestone-12e-unit-diagnostic.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload unit diagnostic
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: milestone-12e-unit-diagnostic-${{ github.event.pull_request.head.sha }}
          path: milestone-12e-unit-diagnostic.log
          if-no-files-found: error
          retention-days: 7
