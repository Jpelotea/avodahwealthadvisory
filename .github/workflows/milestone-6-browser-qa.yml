name: Milestone 8 Definitive Browser QA and Performance

on:
  push:
    branches: [agent/blueprint-foundation]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milestone-8-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BASE_URL: https://deploy-preview-8--avodahwealthadvisory.netlify.app
  EXPECTED_RC_REVISION: m8-deploy-recovery-v1

jobs:
  synchronization-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Reproduce Netlify static build
        run: npm run build
      - name: Run synchronization isolation and Edge import unit tests
        run: npm run test:unit
      - name: Upload synchronization and build-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-8-sync-isolation-${{ github.sha }}
          path: test-results/unit
          if-no-files-found: ignore
          retention-days: 30

  browser-qa:
    needs: synchronization-isolation
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install ${{ matrix.browser }} browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Wait for protected release marker
        shell: bash
        run: |
          mkdir -p test-results/evidence
          for i in {1..60}; do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' "$PLAYWRIGHT_BASE_URL" || true)
            robots=$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            revision=$(awk 'BEGIN{IGNORECASE=1} /^x-avodah-rc-revision:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            deploy_context=$(awk 'BEGIN{IGNORECASE=1} /^x-avodah-deploy-context:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            rm -f "$headers"
            echo "attempt=$i status=$code expected=$EXPECTED_RC_REVISION observed=$revision context=$deploy_context robots=$robots"
            if [ "$code" = "200" ] && echo "$robots" | grep -qi 'noindex' && [ "$revision" = "$EXPECTED_RC_REVISION" ] && [ "$deploy_context" = "deploy-preview" ]; then
              printf '{"expectedReleaseMarker":"%s","observedReleaseMarker":"%s","deployContext":"%s","httpStatus":%s,"target":"%s","workflowSha":"%s"}\n' "$EXPECTED_RC_REVISION" "$revision" "$deploy_context" "$code" "$PLAYWRIGHT_BASE_URL" "$GITHUB_SHA" > "test-results/evidence/revision-${{ matrix.browser }}.json"
              exit 0
            fi
            sleep 10
          done
          echo "Deploy Preview did not reach protected marker $EXPECTED_RC_REVISION."
          exit 1
      - name: Run ${{ matrix.browser }} browser QA
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload ${{ matrix.browser }} QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-8-${{ matrix.browser }}-qa-${{ github.sha }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30

  performance:
    needs: synchronization-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium
      - name: Wait for protected release marker
        shell: bash
        run: |
          mkdir -p test-results/lighthouse
          for i in {1..60}; do
            headers=$(mktemp)
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' "$PLAYWRIGHT_BASE_URL" || true)
            robots=$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            revision=$(awk 'BEGIN{IGNORECASE=1} /^x-avodah-rc-revision:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            deploy_context=$(awk 'BEGIN{IGNORECASE=1} /^x-avodah-deploy-context:/ {sub(/^[^:]+:[[:space:]]*/, ""); print}' "$headers" | tr -d '\r')
            rm -f "$headers"
            echo "attempt=$i status=$code expected=$EXPECTED_RC_REVISION observed=$revision context=$deploy_context robots=$robots"
            if [ "$code" = "200" ] && echo "$robots" | grep -qi 'noindex' && [ "$revision" = "$EXPECTED_RC_REVISION" ] && [ "$deploy_context" = "deploy-preview" ]; then
              printf '{"expectedReleaseMarker":"%s","observedReleaseMarker":"%s","deployContext":"%s","httpStatus":%s,"target":"%s","workflowSha":"%s"}\n' "$EXPECTED_RC_REVISION" "$revision" "$deploy_context" "$code" "$PLAYWRIGHT_BASE_URL" "$GITHUB_SHA" > test-results/lighthouse/revision.json
              exit 0
            fi
            sleep 10
          done
          echo "Deploy Preview did not reach protected marker $EXPECTED_RC_REVISION."
          exit 1
      - name: Run Lighthouse on priority workflows
        shell: bash
        run: |
          CHROME_PATH=$(node -e "console.log(require('playwright').chromium.executablePath())")
          export CHROME_PATH
          declare -A pages=(
            [homepage]="/"
            [consultation]="/consultation/"
            [client-support]="/client-support/"
            [recruitment-application]="/careers/apply/"
          )
          lighthouse_status=0
          for name in homepage consultation client-support recruitment-application; do
            npx --yes lighthouse@13.4.1 "${PLAYWRIGHT_BASE_URL}${pages[$name]}" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output=html \
              --output-path="test-results/lighthouse/$name" \
              --quiet || lighthouse_status=1
          done
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const directory = 'test-results/lighthouse';
          const reports = fs.readdirSync(directory).filter(name => name.endsWith('.report.json'));
          const summary = reports.map(file => {
            const report = JSON.parse(fs.readFileSync(path.join(directory, file), 'utf8'));
            const a = report.audits || {};
            return {
              page: file.replace('.report.json', ''),
              finalUrl: report.finalUrl,
              runtimeError: report.runtimeError || null,
              scores: Object.fromEntries(Object.entries(report.categories || {}).map(([key, value]) => [key, value.score == null ? null : Math.round(value.score * 100)])),
              metrics: {
                largestContentfulPaintMs: a['largest-contentful-paint']?.numericValue ?? null,
                cumulativeLayoutShift: a['cumulative-layout-shift']?.numericValue ?? null,
                totalBlockingTimeMs: a['total-blocking-time']?.numericValue ?? null,
                speedIndexMs: a['speed-index']?.numericValue ?? null,
              }
            };
          });
          fs.writeFileSync(path.join(directory, 'summary.json'), JSON.stringify(summary, null, 2));
          if (summary.length !== 4 || summary.some(item => item.runtimeError)) process.exitCode = 1;
          NODE
          exit "$lighthouse_status"
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-8-lighthouse-${{ github.sha }}
          path: test-results/lighthouse
          if-no-files-found: warn
          retention-days: 30
