name: Milestone 6 Browser QA

on:
  push:
    branches: [agent/blueprint-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: https://deploy-preview-8--avodahwealthadvisory.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Wait for matching preview
        run: |
          for i in {1..30}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PLAYWRIGHT_BASE_URL" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Run browser QA
        run: npm run test:e2e
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-6-browser-qa-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 30
