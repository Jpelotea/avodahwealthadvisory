name: Milestone 9 Isolated Forms Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

env:
  EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  forms-secrets-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run-isolated-forms]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.forms-preflight.outputs.status }}
    env:
      FORM_TEST_AUTH_TOKEN: ${{ secrets.NETLIFY_FORM_TEST_AUTH_TOKEN }}
      FORM_TEST_SITE_ID: ${{ secrets.NETLIFY_FORM_TEST_SITE_ID }}
      EXPECTED_FORM_TEST_SITE_ID: e07260a5-6308-4f68-a41d-d26f267df9ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
      - name: Validate preflight and isolated harness contracts
        run: |
          node --check scripts/test-isolated-form-submissions.mjs
          node --test tests/unit/forms-secret-preflight-contract.test.mjs
      - name: Verify protected isolated test credentials
        id: forms-preflight
        run: node scripts/forms-secret-preflight.mjs
      - name: Upload protected preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-11-isolated-forms-preflight-${{ env.EXPECTED_COMMIT }}-${{ github.run_attempt }}
          path: test-results/forms/secrets-status.json
          if-no-files-found: error
          retention-days: 30

  deploy-and-verify-isolated-forms:
    needs: forms-secrets-preflight
    if: needs.forms-secrets-preflight.result == 'success' && needs.forms-secrets-preflight.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_FORM_TEST_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FORM_TEST_SITE_ID }}
      EXPECTED_NETLIFY_SITE_ID: e07260a5-6308-4f68-a41d-d26f267df9ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Verify isolated environment and fixture boundaries
        shell: bash
        run: |
          mkdir -p test-results/forms qa/form-fixture/empty-functions
          node - <<'NODE'
          const fs = require('fs');
          const pattern = /(GOOGLE|APPS_SCRIPT|CALENDAR|MEET|OPERATIONS_HUB|PRODUCTION_WEBHOOK|EMAIL_RECIPIENT|GA_MEASUREMENT|META_PIXEL)/i;
          const forbidden = Object.keys(process.env).filter(name => pattern.test(name)).sort();
          const report = {
            expectedSiteId: process.env.EXPECTED_NETLIFY_SITE_ID,
            exactRevision: process.env.EXPECTED_COMMIT,
            forbiddenEnvironmentVariableNamesPresent: forbidden,
            fixtureDirectory: 'qa/form-fixture',
            explicitEmptyFunctionsDirectory: true,
            productionNetlifyFunctionsIncluded: false,
            productionEdgeFunctionsIncluded: false,
            productionSystemsContacted: false,
          };
          fs.writeFileSync('test-results/forms/production-isolation.json', JSON.stringify(report, null, 2));
          if (forbidden.length) throw new Error(`Forbidden production environment names present: ${forbidden.join(', ')}`);
          NODE
          test -f qa/form-fixture/index.html
          test -f qa/form-fixture/confirmation.html
          test -f qa/form-fixture/_headers
          if find qa/form-fixture -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | grep -q .; then exit 1; fi
          if grep -RnE 'GOOGLE_SHEETS_WEBHOOK|script\.google\.com|calendar\.google|meet\.google|(^|[^A-Z0-9])G-[A-Z0-9]{6,}([^A-Z0-9]|$)|facebook\.com/tr|avodahwealthadvisory\.netlify\.app' qa/form-fixture; then exit 1; fi

      - name: Deploy only the isolated form fixture
        shell: bash
        run: |
          set +e
          (
            cd qa/form-fixture
            npx --yes netlify-cli@latest deploy \
              --dir=. \
              --functions=empty-functions \
              --skip-functions-cache \
              --site="$NETLIFY_SITE_ID" \
              --auth="$NETLIFY_AUTH_TOKEN" \
              --prod \
              --no-build \
              --timeout=600000 \
              --message="Milestone 11 isolated form fixture ${EXPECTED_COMMIT}" \
              --json
          ) > test-results/forms/deploy-raw.json 2> test-results/forms/deploy-stderr.log
          deploy_exit=$?
          set -e
          if [ "$deploy_exit" -ne 0 ]; then
            echo "::error::Netlify CLI fixture deploy exited with status $deploy_exit"
            exit "$deploy_exit"
          fi
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('test-results/forms/deploy-raw.json', 'utf8'));
          const safe = {
            deployId: raw.deploy_id || raw.deployId || '',
            url: raw.url || '',
            deployUrl: raw.deploy_url || raw.deployUrl || '',
            revision: process.env.EXPECTED_COMMIT,
            isolatedSiteId: process.env.EXPECTED_NETLIFY_SITE_ID,
          };
          if (!safe.deployId || !safe.url || !safe.deployUrl) throw new Error('Incomplete Netlify deployment metadata.');
          fs.writeFileSync('test-results/forms/deploy-safe.json', JSON.stringify(safe, null, 2));
          NODE

      - name: Verify terminal deploy and reject inherited runtime
        shell: bash
        run: |
          deploy_id=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployId)")
          curl --silent --show-error --fail -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/deploys/$deploy_id" > test-results/forms/deploy-status-raw.json
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('test-results/forms/deploy-status-raw.json', 'utf8'));
          const safe = JSON.parse(fs.readFileSync('test-results/forms/deploy-safe.json', 'utf8'));
          const functions = status.available_functions || [];
          const edge = status.edge_functions_present === true;
          if (!['ready', 'current'].includes(status.state)) throw new Error(`Deploy state is ${status.state}`);
          if (status.site_id !== process.env.EXPECTED_NETLIFY_SITE_ID) throw new Error('Wrong isolated site ID.');
          if (functions.length || edge) throw new Error(`Inherited runtime detected: functions=${functions.length}, edge=${edge}`);
          Object.assign(safe, {
            state: status.state,
            context: status.context,
            createdAt: status.created_at,
            updatedAt: status.updated_at,
            publishedAt: status.published_at,
            deployTitle: status.title || '',
            availableFunctionCount: functions.length,
            edgeFunctionsPresent: edge,
            productionWebsiteContacted: false,
          });
          fs.writeFileSync('test-results/forms/deploy-safe.json', JSON.stringify(safe, null, 2));
          const isolation = JSON.parse(fs.readFileSync('test-results/forms/production-isolation.json', 'utf8'));
          isolation.productionNetlifyFunctionsIncluded = functions.length > 0;
          isolation.productionEdgeFunctionsIncluded = edge;
          fs.writeFileSync('test-results/forms/production-isolation.json', JSON.stringify(isolation, null, 2));
          NODE

      - name: Verify isolated HTTP protections
        shell: bash
        run: |
          deploy_url=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployUrl)")
          curl --silent --show-error --fail --dump-header test-results/forms/fixture-response-headers.txt \
            --output test-results/forms/fixture-response-body.html "$deploy_url/"
          node - <<'NODE'
          const fs = require('fs');
          const headers = fs.readFileSync('test-results/forms/fixture-response-headers.txt', 'utf8');
          const body = fs.readFileSync('test-results/forms/fixture-response-body.html', 'utf8');
          const report = {
            testNoticePresent: /TEST ENVIRONMENT — SYNTHETIC DATA ONLY/.test(body),
            htmlNoindexPresent: /<meta\s+name=["']robots["'][^>]+noindex/i.test(body),
            headerNoindexPresent: /x-robots-tag:\s*noindex,\s*nofollow,\s*noarchive/i.test(headers),
            cacheControlNoStorePresent: /cache-control:\s*no-store/i.test(headers),
            referrerPolicyNoReferrerPresent: /referrer-policy:\s*no-referrer/i.test(headers),
          };
          report.passed = Object.values(report).every(Boolean);
          fs.writeFileSync('test-results/forms/fixture-http.json', JSON.stringify(report, null, 2));
          if (!report.passed) throw new Error('Fixture HTTP protections failed.');
          NODE

      - name: Retrieve and verify six Forms schemas and hooks
        shell: bash
        run: |
          curl --silent --show-error --fail -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/forms" > test-results/forms/netlify-forms.json
          curl --silent --show-error --fail -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/hooks?site_id=$NETLIFY_SITE_ID" > test-results/forms/site-hooks.json
          node -e "const h=require('./test-results/forms/site-hooks.json'); if(h.length) throw new Error('Hooks configured')"
          NETLIFY_FORMS_JSON=test-results/forms/netlify-forms.json FORM_SCHEMA_REPORT=test-results/forms/schema-report.json node scripts/verify-isolated-form-schemas.mjs

      - name: Run synthetic matrix and cleanup
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          export ISOLATED_FORM_URL=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployUrl)")
          export SYNTHETIC_FORM_REPORT=test-results/forms/synthetic-submissions.json
          node scripts/test-isolated-form-submissions.mjs

      - name: Upload isolated Forms evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-11-isolated-forms-${{ env.EXPECTED_COMMIT }}-${{ github.run_attempt }}
          path: |
            test-results/forms
            qa/form-fixture
          if-no-files-found: warn
          retention-days: 30
