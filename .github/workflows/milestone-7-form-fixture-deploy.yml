name: Milestone 9 Isolated Forms Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

env:
  EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  forms-secrets-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[run-isolated-forms]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.forms-preflight.outputs.status }}
    env:
      FORM_TEST_AUTH_TOKEN: ${{ secrets.NETLIFY_FORM_TEST_AUTH_TOKEN }}
      FORM_TEST_SITE_ID: ${{ secrets.NETLIFY_FORM_TEST_SITE_ID }}
      EXPECTED_FORM_TEST_SITE_ID: e07260a5-6308-4f68-a41d-d26f267df9ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}
      - name: Validate preflight and isolated harness contracts
        run: |
          node --check scripts/test-isolated-form-submissions.mjs
          node --test tests/unit/forms-secret-preflight-contract.test.mjs
      - name: Verify protected isolated test credentials
        id: forms-preflight
        run: node scripts/forms-secret-preflight.mjs
      - name: Upload protected preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-11-isolated-forms-preflight-${{ env.EXPECTED_COMMIT }}-${{ github.run_attempt }}
          path: test-results/forms/secrets-status.json
          if-no-files-found: error
          retention-days: 30

  deploy-and-verify-isolated-forms:
    needs: forms-secrets-preflight
    if: needs.forms-secrets-preflight.result == 'success' && needs.forms-secrets-preflight.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_FORM_TEST_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FORM_TEST_SITE_ID }}
      EXPECTED_NETLIFY_SITE_ID: e07260a5-6308-4f68-a41d-d26f267df9ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Verify isolated environment and fixture boundaries
        shell: bash
        run: |
          mkdir -p test-results/forms
          node - <<'NODE'
          const fs = require('fs');
          const allowed = new Set(['NETLIFY_AUTH_TOKEN', 'NETLIFY_SITE_ID', 'EXPECTED_NETLIFY_SITE_ID', 'EXPECTED_COMMIT']);
          const productionPattern = /(GOOGLE|APPS_SCRIPT|CALENDAR|MEET|OPERATIONS_HUB|PRODUCTION_WEBHOOK|EMAIL_RECIPIENT|GA_MEASUREMENT|META_PIXEL)/i;
          const forbiddenNames = Object.keys(process.env).filter(name => productionPattern.test(name) && !allowed.has(name)).sort();
          const report = {
            expectedSiteId: process.env.EXPECTED_NETLIFY_SITE_ID,
            exactRevision: process.env.EXPECTED_COMMIT,
            allowedProtectedSecretNames: ['NETLIFY_FORM_TEST_AUTH_TOKEN', 'NETLIFY_FORM_TEST_SITE_ID'],
            forbiddenEnvironmentVariableNamesPresent: forbiddenNames,
            fixtureDirectory: 'qa/form-fixture',
            fixtureWorkingDirectoryIsolated: true,
            productionNetlifyFunctionsIncluded: false,
            productionEdgeFunctionsIncluded: false,
            productionWebhookConfigured: false,
            GoogleSheetsConfigured: false,
            GoogleAppsScriptConfigured: false,
            GoogleCalendarConfigured: false,
            GoogleMeetConfigured: false,
            productionEmailRecipientConfigured: false,
            operationsHubConfigured: false,
            productionAnalyticsConfigured: false,
          };
          fs.writeFileSync('test-results/forms/production-isolation.json', JSON.stringify(report, null, 2));
          if (forbiddenNames.length) throw new Error(`Forbidden production environment variable name(s) present: ${forbiddenNames.join(', ')}`);
          NODE

          test -f qa/form-fixture/index.html
          test -f qa/form-fixture/confirmation.html
          test -f qa/form-fixture/_headers
          if find qa/form-fixture -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.ts' \) | grep -q .; then
            echo "::error::Executable integration file found in isolated fixture"
            exit 1
          fi
          if grep -RnE 'GOOGLE_SHEETS_WEBHOOK|script\.google\.com|calendar\.google|meet\.google|(^|[^A-Z0-9])G-[A-Z0-9]{6,}([^A-Z0-9]|$)|facebook\.com/tr|avodahwealthadvisory\.netlify\.app' qa/form-fixture; then
            echo "::error::Potential production integration identifier found in isolated fixture"
            exit 1
          fi

      - name: Deploy only the isolated form fixture
        shell: bash
        run: |
          (
            cd qa/form-fixture
            npx --yes netlify-cli@latest deploy \
              --dir=. \
              --site="$NETLIFY_SITE_ID" \
              --auth="$NETLIFY_AUTH_TOKEN" \
              --prod \
              --no-build \
              --message="Milestone 11 isolated form fixture ${EXPECTED_COMMIT}" \
              --json
          ) > test-results/forms/deploy-raw.json

          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('test-results/forms/deploy-raw.json', 'utf8'));
          const safe = {
            deployId: raw.deploy_id || raw.deployId || '',
            url: raw.url || '',
            deployUrl: raw.deploy_url || raw.deployUrl || '',
            logs: raw.logs || '',
            revision: process.env.EXPECTED_COMMIT,
            isolatedSiteId: process.env.EXPECTED_NETLIFY_SITE_ID,
          };
          if (!safe.deployId || !safe.url || !safe.deployUrl) throw new Error('Netlify CLI did not return complete deployment metadata.');
          fs.writeFileSync('test-results/forms/deploy-safe.json', JSON.stringify(safe, null, 2));
          NODE

      - name: Wait for terminal isolated deployment state and reject inherited runtime
        shell: bash
        run: |
          deploy_id=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployId)")
          state=""
          for attempt in {1..60}; do
            curl --silent --show-error --fail \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$deploy_id" \
              > test-results/forms/deploy-status-raw.json
            state=$(node -e "console.log(require('./test-results/forms/deploy-status-raw.json').state || '')")
            echo "attempt=$attempt isolated-deploy-state=$state"
            case "$state" in
              ready|current) break ;;
              error|failed) echo "::error::Isolated Netlify deployment failed"; exit 1 ;;
            esac
            sleep 5
          done
          if [ "$state" != "ready" ] && [ "$state" != "current" ]; then
            echo "::error::Isolated Netlify deployment did not reach a terminal ready state"
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const safe = JSON.parse(fs.readFileSync('test-results/forms/deploy-safe.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('test-results/forms/deploy-status-raw.json', 'utf8'));
          const functions = status.available_functions || [];
          const edgePresent = status.edge_functions_present === true;
          if (status.site_id !== process.env.EXPECTED_NETLIFY_SITE_ID) throw new Error('Deploy record does not belong to the approved isolated site.');
          if (functions.length || edgePresent) throw new Error(`Isolated deploy inherited runtime code: functions=${functions.length}, edge=${edgePresent}`);
          Object.assign(safe, {
            state: status.state,
            context: status.context,
            createdAt: status.created_at,
            updatedAt: status.updated_at,
            publishedAt: status.published_at,
            commitRef: status.commit_ref || null,
            deployTitle: status.title || '',
            availableFunctionCount: functions.length,
            edgeFunctionsPresent: edgePresent,
            productionWebsiteContacted: false,
          });
          fs.writeFileSync('test-results/forms/deploy-safe.json', JSON.stringify(safe, null, 2));
          const isolation = JSON.parse(fs.readFileSync('test-results/forms/production-isolation.json', 'utf8'));
          isolation.productionNetlifyFunctionsIncluded = functions.length > 0;
          isolation.productionEdgeFunctionsIncluded = edgePresent;
          fs.writeFileSync('test-results/forms/production-isolation.json', JSON.stringify(isolation, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Isolated Forms deployment\n\n- URL: ${safe.url}\n- Immutable URL: ${safe.deployUrl}\n- Deploy ID: ${safe.deployId}\n- Revision: ${safe.revision}\n- State: ${safe.state}\n- Functions: ${safe.availableFunctionCount}\n- Edge Functions: ${safe.edgeFunctionsPresent ? 'present' : 'none'}\n- Production website contacted: no\n`);
          NODE

      - name: Verify isolated notice, noindex, and no-store headers
        shell: bash
        run: |
          deploy_url=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployUrl)")
          curl --silent --show-error --fail \
            --dump-header test-results/forms/fixture-response-headers.txt \
            --output test-results/forms/fixture-response-body.html \
            "$deploy_url/"
          node - <<'NODE'
          const fs = require('fs');
          const headers = fs.readFileSync('test-results/forms/fixture-response-headers.txt', 'utf8');
          const body = fs.readFileSync('test-results/forms/fixture-response-body.html', 'utf8');
          const report = {
            testNoticePresent: /TEST ENVIRONMENT — SYNTHETIC DATA ONLY/.test(body),
            htmlNoindexPresent: /<meta\s+name=["']robots["'][^>]+noindex/i.test(body),
            headerNoindexPresent: /x-robots-tag:\s*noindex,\s*nofollow,\s*noarchive/i.test(headers),
            cacheControlNoStorePresent: /cache-control:\s*no-store/i.test(headers),
            referrerPolicyNoReferrerPresent: /referrer-policy:\s*no-referrer/i.test(headers),
          };
          report.passed = Object.values(report).every(value => value === true);
          fs.writeFileSync('test-results/forms/fixture-http.json', JSON.stringify(report, null, 2));
          if (!report.passed) throw new Error('Isolated fixture HTTP protections or test notice are incomplete.');
          NODE

      - name: Retrieve detected Forms schemas and isolated hooks
        shell: bash
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/forms" \
            > test-results/forms/netlify-forms.json
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/hooks?site_id=$NETLIFY_SITE_ID" \
            > test-results/forms/site-hooks.json
          node - <<'NODE'
          const fs = require('fs');
          const hooks = JSON.parse(fs.readFileSync('test-results/forms/site-hooks.json', 'utf8'));
          const forms = JSON.parse(fs.readFileSync('test-results/forms/netlify-forms.json', 'utf8'));
          if (hooks.length) throw new Error(`Isolated site has ${hooks.length} configured hook(s); verification requires no webhook or notification integration.`);
          const safe = JSON.parse(fs.readFileSync('test-results/forms/deploy-safe.json', 'utf8'));
          safe.detectedFormCount = forms.length;
          safe.configuredHookCount = hooks.length;
          safe.productionIntegrationsAbsent = hooks.length === 0;
          fs.writeFileSync('test-results/forms/deploy-safe.json', JSON.stringify(safe, null, 2));
          const isolation = JSON.parse(fs.readFileSync('test-results/forms/production-isolation.json', 'utf8'));
          isolation.configuredNetlifyHooks = hooks.length;
          isolation.productionSystemsContacted = false;
          fs.writeFileSync('test-results/forms/production-isolation.json', JSON.stringify(isolation, null, 2));
          NODE

      - name: Verify all six Netlify-detected form schemas
        env:
          NETLIFY_FORMS_JSON: test-results/forms/netlify-forms.json
          FORM_SCHEMA_REPORT: test-results/forms/schema-report.json
        run: node scripts/verify-isolated-form-schemas.mjs

      - name: Install Chromium for synthetic form verification
        run: npx playwright install --with-deps chromium

      - name: Run synthetic submissions and cleanup
        shell: bash
        run: |
          export ISOLATED_FORM_URL=$(node -e "console.log(require('./test-results/forms/deploy-safe.json').deployUrl)")
          export SYNTHETIC_FORM_REPORT=test-results/forms/synthetic-submissions.json
          node scripts/test-isolated-form-submissions.mjs

      - name: Upload isolated Forms deployment and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-11-isolated-forms-${{ env.EXPECTED_COMMIT }}-${{ github.run_attempt }}
          path: |
            test-results/forms/deploy-safe.json
            test-results/forms/deploy-status-raw.json
            test-results/forms/netlify-forms.json
            test-results/forms/site-hooks.json
            test-results/forms/schema-report.json
            test-results/forms/synthetic-submissions.json
            test-results/forms/production-isolation.json
            test-results/forms/fixture-http.json
            test-results/forms/fixture-response-headers.txt
            qa/form-fixture
          if-no-files-found: warn
          retention-days: 30
